<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Выберите источник</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
        background: #14171f;
        color: #f3f4f6;
        padding: 20px;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    h2 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
    .grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        overflow-y: auto;
    }
    .source-card {
        background: #181b22;
        border: 2px solid #232733;
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        transition: border-color 0.15s;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .source-card:hover { border-color: #6366f1; }
    .source-card img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 6px;
        background: #0f1117;
    }
    .source-card span {
        font-size: 12px;
        color: #9ca3af;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cancel-btn {
        margin-top: 16px;
        align-self: flex-end;
        background: #1f2430;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 13px;
        cursor: pointer;
    }
    .cancel-btn:hover { background: #2b3142; }
</style>
</head>
<body>
    <h2>Выберите экран или окно для демонстрации</h2>
    <div class="grid" id="grid"></div>
    <button class="cancel-btn" id="cancel-btn">Отмена</button>

    <script>
        const grid = document.getElementById('grid');

        window.pickerAPI.onSources((sources) => {
            grid.innerHTML = '';
            sources.forEach((source) => {
                const card = document.createElement('div');
                card.className = 'source-card';
                card.innerHTML = `<img src="${source.thumbnail}" alt=""><span>${source.name}</span>`;
                card.addEventListener('click', () => window.pickerAPI.select(source.id));
                grid.appendChild(card);
            });
        });

        document.getElementById('cancel-btn').addEventListener('click', () => window.pickerAPI.cancel());
    </script>
</body>
</html>
