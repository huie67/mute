<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mute — оверлей</title>
<style>
  :root {
    --accent: #5b8cff;
    --ok: #3ddc84;
    --danger: #ff5d6c;
    --text: #f2f4f8;
    --muted: #a7adbb;
  }
  * { box-sizing: border-box; }
  body.away .widget { display: none !important; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font: 14px/1.3 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- Виджеты ---------- */
  .widget {
    position: absolute; left: 0; top: 0;
    transform-origin: top left;
    background: none;
    padding: 4px;
  }
  .widget.hidden { display: none; }
  body.edit .widget {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    outline: 2px dashed rgba(255, 255, 255, 0.55);
    outline-offset: 2px;
    cursor: move;
    touch-action: none;
  }
  body.edit .widget.hidden { display: block; opacity: 0.35 !important; }
  .widget-label {
    display: none;
    position: absolute; left: 6px; top: -22px;
    padding: 1px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 11px; white-space: nowrap;
  }
  body.edit .widget-label { display: block; }

  /* Участники */
  #w-voice { min-width: 190px; max-width: 320px; }
  .voice-row { display: flex; align-items: center; gap: 10px; padding: 3px 4px; }
  .voice-row + .voice-row { margin-top: 2px; }
  .voice-avatar-wrap { position: relative; flex: none; width: 36px; height: 36px; }
  .voice-avatar {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block;
    background: #2a2d38;
    border: 3px solid transparent;
  }
  .voice-row.speaking .voice-avatar {
    border-color: var(--ok);
    box-shadow: 0 0 10px rgba(61, 220, 132, 0.75);
  }
  .voice-name {
    font-weight: 600; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.6);
    min-width: 0;
  }
  .voice-row:not(.speaking) .voice-name { opacity: 0.85; }
  .voice-flags { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .flag {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--danger); display: grid; place-items: center;
  }
  .flag svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .voice-empty { padding: 6px 10px; color: var(--muted); font-size: 13px; }

  /* Музыка */
  #w-music { display: flex; align-items: center; gap: 12px; width: 280px; padding: 6px 8px; }
  .eq { flex: none; display: flex; align-items: flex-end; gap: 3px; width: 22px; height: 22px; }
  .eq i { flex: 1; background: var(--accent); border-radius: 2px; }
  .eq i:nth-child(1) { height: 55%; }
  .eq i:nth-child(2) { height: 100%; }
  .eq i:nth-child(3) { height: 40%; }
  .music-text { min-width: 0; }
  .music-kicker { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #cfd4df; text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9); }
  .music-title {
    font-weight: 600; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.6);
  }

  /* Сообщения */
  #w-msgs { width: 340px; }
  .msg-card { display: flex; align-items: flex-start; gap: 10px; padding: 4px; animation: none; }
  .msg-card + .msg-card { margin-top: 6px; }
  .msg-avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #2a2d38; }
  .msg-body { min-width: 0; }
  .msg-head { display: flex; align-items: center; gap: 6px; }
  .msg-name { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.6); }
  .msg-tag { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 6px; background: var(--accent); color: #fff; }
  .msg-tag.mention { background: #e0a526; }
  .msg-text { font-size: 14px; line-height: 1.3; color: #fff; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.6); }

  /* Демонстрация экрана */
  #w-video { width: 360px; padding: 0; }
  #demo-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: rgba(0, 0, 0, 0.35); }
  #demo-video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  #demo-video.off { display: none; }
  #demo-name {
    position: absolute; left: 8px; bottom: 6px; font-weight: 600; font-size: 13px;
    text-shadow: 0 0 3px #000, 0 1px 4px rgba(0, 0, 0, 0.9);
  }
  #demo-ph { display: none; position: absolute; inset: 0; place-items: center; color: #cfd4df; font-size: 14px; }
  body.edit #demo-ph { display: grid; }

  /* ---------- Панель настройки ---------- */
  #panel {
    display: none;
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    width: min(560px, calc(100vw - 24px));
    background: rgba(18, 19, 26, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 14px 16px 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    cursor: default;
  }
  body.edit #panel { display: block; }
  #panel h1 { margin: 0 0 4px; font-size: 16px; }
  #panel .hint { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .prow {
    display: grid; grid-template-columns: 112px 1fr 1fr; gap: 14px; align-items: center;
    padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .prow label.check { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .slider { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  .slider span b { color: var(--text); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .popts { display: flex; align-items: center; gap: 8px; padding: 8px 0 2px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .popts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .pbtns { display: flex; gap: 8px; margin-left: auto; }
  button {
    font: inherit; font-weight: 600; color: var(--text);
    background: rgba(255, 255, 255, 0.1); border: 0; border-radius: 9px;
    padding: 7px 14px; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div class="widget" id="w-voice" data-key="voice">
  <div class="widget-label">Участники</div>
  <div id="voice-list"></div>
</div>

<div class="widget" id="w-music" data-key="music">
  <div class="widget-label">Музыка</div>
  <div class="eq"><i></i><i></i><i></i></div>
  <div class="music-text">
    <div class="music-kicker">Сейчас играет</div>
    <div class="music-title" id="music-title">—</div>
  </div>
</div>

<div class="widget" id="w-msgs" data-key="messages">
  <div class="widget-label">Сообщения</div>
  <div id="msg-list"></div>
</div>

<div class="widget" id="w-video" data-key="video">
  <div class="widget-label">Демонстрация экрана</div>
  <div id="demo-frame">
    <video id="demo-video" class="off" autoplay muted playsinline></video>
    <div id="demo-ph">Демонстрация экрана</div>
    <div id="demo-name"></div>
  </div>
</div>

<div id="panel">
  <h1>Настройка оверлея</h1>
  <p class="hint">Перетаскивайте блоки мышью. Здесь же — показать/скрыть, прозрачность и размер.</p>
  <div class="prow" data-key="voice">
    <label class="check"><input type="checkbox" class="c-visible"> Участники</label>
    <div class="slider"><span>Прозрачность: <b class="v-opacity"></b></span><input type="range" class="r-opacity" min="20" max="100" step="5"></div>
    <div class="slider"><span>Размер: <b class="v-scale"></b></span><input type="range" class="r-scale" min="60" max="200" step="5"></div>
  </div>
  <div class="prow" data-key="music">
    <label class="check"><input type="checkbox" class="c-visible"> Музыка</label>
    <div class="slider"><span>Прозрачность: <b class="v-opacity"></b></span><input type="range" class="r-opacity" min="20" max="100" step="5"></div>
    <div class="slider"><span>Размер: <b class="v-scale"></b></span><input type="range" class="r-scale" min="60" max="200" step="5"></div>
  </div>
  <div class="prow" data-key="messages">
    <label class="check"><input type="checkbox" class="c-visible"> Чат</label>
    <div class="slider"><span>Прозрачность: <b class="v-opacity"></b></span><input type="range" class="r-opacity" min="20" max="100" step="5"></div>
    <div class="slider"><span>Размер: <b class="v-scale"></b></span><input type="range" class="r-scale" min="60" max="200" step="5"></div>
  </div>
  <div class="prow" data-key="video">
    <label class="check"><input type="checkbox" class="c-visible"> Демонстрация</label>
    <div class="slider"><span>Прозрачность: <b class="v-opacity"></b></span><input type="range" class="r-opacity" min="20" max="100" step="5"></div>
    <div class="slider"><span>Размер: <b class="v-scale"></b></span><input type="range" class="r-scale" min="60" max="200" step="5"></div>
  </div>
  <div class="popts">
    <label><input type="checkbox" id="c-chat-dm"> Чат: личные (шёпот) и упоминания</label>
    <label><input type="checkbox" id="c-chat-all"> Чат: все сообщения</label>
  </div>
  <div class="popts">
    <label><input type="checkbox" id="c-only-speaking"> Показывать только говорящих</label>
    <div class="pbtns">
      <button type="button" id="b-reset">Сбросить</button>
      <button type="button" class="primary" id="b-done">Готово</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var T = window.__TAURI__ || {};
  var tEvent = T.event, tCore = T.core;

  var STORAGE_KEY = 'mute_overlay_v1';
  var DEFAULTS = {
    voice: { x: 0.015, y: 0.30, opacity: 100, scale: 100, visible: true },
    music: { x: 0.015, y: 0.88, opacity: 100, scale: 100, visible: true },
    messages: { x: 0.70, y: 0.04, opacity: 100, scale: 100, visible: true },
    video: { x: 0.70, y: 0.30, opacity: 100, scale: 100, visible: false },
    chatDm: true,
    chatAll: false,
    onlySpeaking: false
  };

  var KEYS = ['voice', 'music', 'messages', 'video'];
  var MSG_MS = 5000;
  var MSG_MAX = 4;
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    var s = clone(DEFAULTS);
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (raw && typeof raw === 'object') {
        KEYS.forEach(function (k) {
          if (raw[k] && typeof raw[k] === 'object') {
            for (var p in s[k]) if (raw[k][p] !== undefined && typeof raw[k][p] === typeof s[k][p]) s[k][p] = raw[k][p];
          }
        });
        if (typeof raw.onlySpeaking === 'boolean') s.onlySpeaking = raw.onlySpeaking;
        if (typeof raw.chatDm === 'boolean') s.chatDm = raw.chatDm;
        if (typeof raw.chatAll === 'boolean') s.chatAll = raw.chatAll;
      }
    } catch (e) { /* ignore */ }
    return s;
  }
  var settings = load();
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* ignore */ } }

  var state = { inCall: false, users: [], music: { title: '', playing: false }, demo: { available: false, name: '' } };
  var editing = false;

  var els = {
    voice: document.getElementById('w-voice'),
    music: document.getElementById('w-music'),
    messages: document.getElementById('w-msgs'),
    video: document.getElementById('w-video')
  };
  var demoVideo = document.getElementById('demo-video');
  var demoName = document.getElementById('demo-name');
  var videoLive = false;
  var msgList = document.getElementById('msg-list');
  var msgs = [];
  var DEMO_MSGS = [
    { id: 'm1', name: 'Участник 1', text: 'Так будут выглядеть личные сообщения', kind: 'dm', color: '', avatar: '' },
    { id: 'm2', name: 'Участник 2', text: 'А так обычные сообщения из чата', kind: 'msg', color: '', avatar: '' }
  ];
  var voiceList = document.getElementById('voice-list');
  var musicTitle = document.getElementById('music-title');

  var MIC_OFF = '<svg viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.8"/><path d="M19 10v2a7 7 0 0 1-1.1 3.8M5 10v2a7 7 0 0 0 11.1 5.7"/></svg>';
  var DEAF_OFF = '<svg viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M3 14v-2a9 9 0 0 1 14.6-7M21 12v2"/><path d="M3 14h3v5H4a1 1 0 0 1-1-1z"/></svg>';

  var DEMO = [
    { id: 'd1', name: 'Участник 1', avatar: '', speaking: true, muted: false, deafened: false, color: '' },
    { id: 'd2', name: 'Участник 2', avatar: '', speaking: false, muted: true, deafened: false, color: '' },
    { id: 'd3', name: 'Участник 3', avatar: '', speaking: false, muted: false, deafened: false, color: '' }
  ];

  function render() {
    // Выключенный блок вообще не рисуем (ни DOM, ни обновлений). В режиме настройки показываем
    // приглушённым, чтобы его можно было включить обратно.
    var on = function (k) { return settings[k].visible || editing; };

    // Участники
    var users = state.users, demo = false;
    if (editing && (!state.inCall || !users.length)) { users = DEMO; demo = true; }
    if (settings.onlySpeaking && !demo) users = users.filter(function (u) { return u.speaking; });
    voiceList.textContent = '';
    if (on('voice')) {
      users.forEach(function (u) {
        var row = document.createElement('div');
        row.className = 'voice-row' + (u.speaking ? ' speaking' : '');
        var wrap = document.createElement('div'); wrap.className = 'voice-avatar-wrap';
        var img = document.createElement('img'); img.className = 'voice-avatar'; img.alt = '';
        img.src = u.avatar || ('https://api.dicebear.com/7.x/identicon/svg?seed=' + encodeURIComponent(u.name || 'u'));
        wrap.appendChild(img);
        var name = document.createElement('div'); name.className = 'voice-name';
        name.textContent = u.name || 'Участник';
        if (u.color) name.style.color = u.color;
        row.appendChild(wrap); row.appendChild(name);
        if (u.muted || u.deafened) {
          var flags = document.createElement('div'); flags.className = 'voice-flags';
          if (u.muted) { var f1 = document.createElement('span'); f1.className = 'flag'; f1.innerHTML = MIC_OFF; flags.appendChild(f1); }
          if (u.deafened) { var f2 = document.createElement('span'); f2.className = 'flag'; f2.innerHTML = DEAF_OFF; flags.appendChild(f2); }
          row.appendChild(flags);
        }
        voiceList.appendChild(row);
      });
    }

    // Музыка
    var m = state.music || {};
    var showMusic = !!(m.title && m.playing);
    if (editing && !showMusic) { musicTitle.textContent = 'Название трека'; showMusic = true; }
    else { musicTitle.textContent = on('music') ? (m.title || '—') : ''; }

    // Сообщения
    msgList.textContent = '';
    var list = msgs;
    if (editing && !list.length) list = DEMO_MSGS;
    if (on('messages')) {
      list.forEach(function (x) {
        var card = document.createElement('div'); card.className = 'msg-card';
        var av = document.createElement('img'); av.className = 'msg-avatar'; av.alt = '';
        av.src = x.avatar || ('https://api.dicebear.com/7.x/identicon/svg?seed=' + encodeURIComponent(x.name || 'u'));
        var body = document.createElement('div'); body.className = 'msg-body';
        var head = document.createElement('div'); head.className = 'msg-head';
        var nm = document.createElement('span'); nm.className = 'msg-name'; nm.textContent = x.name || 'Участник';
        nm.style.color = x.color || '#fff';
        head.appendChild(nm);
        if (x.kind === 'dm' || x.kind === 'mention') {
          var tag = document.createElement('span'); tag.className = 'msg-tag' + (x.kind === 'mention' ? ' mention' : '');
          tag.textContent = x.kind === 'dm' ? 'лично' : '@';
          head.appendChild(tag);
        }
        var tx = document.createElement('div'); tx.className = 'msg-text'; tx.textContent = x.text || '';
        body.appendChild(head); body.appendChild(tx);
        card.appendChild(av); card.appendChild(body);
        msgList.appendChild(card);
      });
    }

    applyVisibility('voice', users.length > 0);
    applyVisibility('music', showMusic);
    applyVisibility('messages', list.length > 0);
    applyVisibility('video', videoLive || (state.demo && state.demo.available && settings.video.visible && wantVideo()));
    demoName.textContent = (videoLive && state.demo && state.demo.name) ? state.demo.name : '';
    demoVideo.classList.toggle('off', !videoLive);
    els.music.classList.toggle('playing', !!m.playing || editing);
  }

  // Блок виден, если он включён в настройках И есть что показывать. В режиме настройки показываем всегда.
  function applyVisibility(key, hasContent) {
    var s = settings[key];
    var el = els[key];
    var hidden = !s.visible || !hasContent;
    if (editing) hidden = !s.visible;
    el.classList.toggle('hidden', hidden);
    if (editing && hidden) el.classList.add('hidden'); // в edit CSS показывает приглушённым
  }

  function applyLayout() {
    KEYS.forEach(function (key) {
      var s = settings[key], el = els[key];
      el.style.opacity = String(s.opacity / 100);
      el.style.transform = 'scale(' + (s.scale / 100) + ')';
      positionWidget(key);
    });
  }

  function positionWidget(key) {
    var s = settings[key], el = els[key];
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = el.offsetWidth * (s.scale / 100), h = el.offsetHeight * (s.scale / 100);
    var x = Math.min(Math.max(0, s.x * vw), Math.max(0, vw - w));
    var y = Math.min(Math.max(0, s.y * vh), Math.max(0, vh - h));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  }

  // ---------- Перетаскивание ----------
  Object.keys(els).forEach(function (key) {
    var el = els[key];
    var drag = null;
    el.addEventListener('pointerdown', function (e) {
      if (!editing || e.button !== 0) return;
      var r = el.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var x = Math.min(Math.max(0, e.clientX - drag.dx), Math.max(0, vw - drag.w));
      var y = Math.min(Math.max(0, e.clientY - drag.dy), Math.max(0, vh - drag.h));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      settings[key].x = x / vw;
      settings[key].y = y / vh;
    });
    function end() { if (drag) { drag = null; save(); } }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });

  // ---------- Панель ----------
  function notifyConfig() { if (tEvent) tEvent.emit('overlay-config-changed', settings).catch(function () {}); }
  function visMap() { var o = {}; KEYS.forEach(function (k) { o[k] = settings[k].visible; }); return o; }

  function syncPanel() {
    document.querySelectorAll('.prow').forEach(function (row) {
      var s = settings[row.getAttribute('data-key')];
      row.querySelector('.c-visible').checked = s.visible;
      row.querySelector('.r-opacity').value = s.opacity;
      row.querySelector('.r-scale').value = s.scale;
      row.querySelector('.v-opacity').textContent = s.opacity + '%';
      row.querySelector('.v-scale').textContent = s.scale + '%';
    });
    document.getElementById('c-only-speaking').checked = settings.onlySpeaking;
    document.getElementById('c-chat-dm').checked = settings.chatDm;
    document.getElementById('c-chat-all').checked = settings.chatAll;
  }

  document.querySelectorAll('.prow').forEach(function (row) {
    var key = row.getAttribute('data-key');
    row.querySelector('.c-visible').addEventListener('change', function (e) {
      settings[key].visible = e.target.checked; save(); render(); applyLayout();
      notifyConfig(); syncVideo();
    });
    row.querySelector('.r-opacity').addEventListener('input', function (e) {
      settings[key].opacity = parseInt(e.target.value, 10);
      row.querySelector('.v-opacity').textContent = settings[key].opacity + '%';
      applyLayout(); save();
    });
    row.querySelector('.r-scale').addEventListener('input', function (e) {
      settings[key].scale = parseInt(e.target.value, 10);
      row.querySelector('.v-scale').textContent = settings[key].scale + '%';
      applyLayout(); save();
    });
  });
  document.getElementById('c-chat-dm').addEventListener('change', function (e) { settings.chatDm = e.target.checked; save(); notifyConfig(); });
  document.getElementById('c-chat-all').addEventListener('change', function (e) { settings.chatAll = e.target.checked; save(); notifyConfig(); });
  document.getElementById('c-only-speaking').addEventListener('change', function (e) {
    settings.onlySpeaking = e.target.checked; save(); render();
  });
  document.getElementById('b-reset').addEventListener('click', function () {
    settings = clone(DEFAULTS); save(); syncPanel(); applyLayout(); render();
  });
  document.getElementById('b-done').addEventListener('click', function () {
    setEditing(false);
    if (tCore) tCore.invoke('overlay_set_edit', { enabled: false }).catch(function () {});
    if (tEvent) tEvent.emit('overlay-edit-changed', false).catch(function () {});
  });
  // Панель — не часть блоков, перетаскивание ей не нужно
  document.getElementById('panel').addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  function setEditing(on) {
    editing = !!on;
    document.body.classList.toggle('edit', editing);
    if (editing) syncPanel();
    render();
    applyLayout();
  }

  window.addEventListener('resize', applyLayout);

  // ---------- Видео демонстрации (локальный WebRTC между окнами приложения) ----------
  // Основное окно отдаёт видеотрек чужой демонстрации, оверлей его показывает. Запрашиваем поток
  // только когда блок включён, оверлей виден (мы в игре) и демонстрация реально идёт.
  var pc = null, pendingIce = [], remoteSet = false;
  function wantVideo() {
    return !!(settings.video.visible && state.demo && state.demo.available && !document.body.classList.contains('away'));
  }
  function stopVideo(notify) {
    if (pc) { try { pc.close(); } catch (e) { /* ignore */ } pc = null; }
    pendingIce = []; remoteSet = false;
    try { demoVideo.srcObject = null; } catch (e) { /* ignore */ }
    var was = videoLive; videoLive = false;
    if (notify && tEvent) tEvent.emit('ov-rtc-stop', null).catch(function () {});
    if (was) render();
  }
  function startVideo() {
    if (pc || !tEvent || typeof RTCPeerConnection === 'undefined') return;
    var mine = new RTCPeerConnection({ iceServers: [] });
    pc = mine; pendingIce = []; remoteSet = false;
    mine.addTransceiver('video', { direction: 'recvonly' });
    mine.ontrack = function (e) {
      if (pc !== mine) return;
      demoVideo.srcObject = new MediaStream([e.track]);
      demoVideo.play().catch(function () {});
      videoLive = true; render(); applyLayout();
    };
    mine.onicecandidate = function (e) {
      if (e.candidate && pc === mine) tEvent.emit('ov-rtc-ice', { c: e.candidate.toJSON() }).catch(function () {});
    };
    mine.createOffer().then(function (o) { return mine.setLocalDescription(o); }).then(function () {
      if (pc === mine) tEvent.emit('ov-rtc-offer', { sdp: mine.localDescription.sdp }).catch(function () {});
    }).catch(function () { if (pc === mine) stopVideo(false); });
  }
  function syncVideo() {
    if (wantVideo()) startVideo(); else if (pc || videoLive) stopVideo(true);
  }

  // ---------- Связь с основным окном ----------
  if (tEvent) {
    tEvent.listen('overlay-state', function (ev) {
      var p = ev && ev.payload;
      if (!p || typeof p !== 'object') return;
      state = {
        inCall: !!p.inCall,
        users: Array.isArray(p.users) ? p.users : [],
        music: p.music && typeof p.music === 'object' ? p.music : { title: '', playing: false },
        demo: p.demo && typeof p.demo === 'object' ? p.demo : { available: false, name: '' }
      };
      syncVideo();
      render();
      applyLayout();
    });
    tEvent.listen('overlay-visible', function (ev) { document.body.classList.toggle('away', !(ev && ev.payload)); syncVideo(); });
    tEvent.listen('ov-rtc-answer', function (ev) {
      var mine = pc; var sdp = ev && ev.payload && ev.payload.sdp;
      if (!mine || !sdp) return;
      mine.setRemoteDescription({ type: 'answer', sdp: sdp }).then(function () {
        if (pc !== mine) return;
        remoteSet = true;
        pendingIce.splice(0).forEach(function (c) { mine.addIceCandidate(c).catch(function () {}); });
      }).catch(function () { if (pc === mine) stopVideo(false); });
    });
    tEvent.listen('ov-rtc-ice', function (ev) {
      var c = ev && ev.payload && ev.payload.c;
      if (!pc || !c) return;
      if (remoteSet) pc.addIceCandidate(c).catch(function () {}); else pendingIce.push(c);
    });
    tEvent.listen('ov-rtc-none', function () { stopVideo(false); });
    tEvent.listen('ov-rtc-restart', function () { stopVideo(false); syncVideo(); });
    tEvent.listen('overlay-message', function (ev) {
      var p = ev && ev.payload;
      if (!p || typeof p !== 'object' || !settings.messages.visible) return;
      if (p.kind === 'dm' || p.kind === 'mention' ? !settings.chatDm : !settings.chatAll) return;
      var item = {
        id: String(p.id || Date.now() + Math.random()),
        name: String(p.name || 'Участник').slice(0, 40),
        text: String(p.text || '').slice(0, 240),
        kind: p.kind === 'dm' || p.kind === 'mention' ? p.kind : 'msg',
        color: typeof p.color === 'string' ? p.color : '',
        avatar: typeof p.avatar === 'string' ? p.avatar : ''
      };
      msgs.push(item);
      if (msgs.length > MSG_MAX) msgs.splice(0, msgs.length - MSG_MAX);
      render(); applyLayout();
      setTimeout(function () {
        var i = msgs.findIndex(function (x) { return x.id === item.id; });
        if (i >= 0) { msgs.splice(i, 1); render(); applyLayout(); }
      }, MSG_MS);
    });
    tEvent.listen('overlay-config', function (ev) {
      var c = ev && ev.payload && ev.payload.cfg;
      if (c && typeof c === 'object') { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); } catch (e) { /* ignore */ } }
      settings = load(); syncPanel(); syncVideo(); render(); applyLayout();
    });
    tEvent.listen('overlay-edit', function (ev) { setEditing(!!(ev && ev.payload)); });
    tEvent.emit('overlay-request-state', null).catch(function () {});
  }

  applyLayout();
  render();
  applyLayout();
})();
</script>
</body>
</html>
